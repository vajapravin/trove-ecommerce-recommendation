{% extends "base.html" %}
{% block title %}Edit · {{ product.title }} · Trove{% endblock %}
{% block content %}
<section class="admin">
  <a class="back-link" href="/admin/products">← Back to products</a>
  <h1>Edit product</h1>

  <form method="post" action="/admin/products/{{ product.id }}/update" class="admin-form stack card-form">
    <label>Title <input type="text" name="title" required value="{{ product.title }}"></label>
    <label>Category <input type="text" name="category" required value="{{ product.category }}"></label>
    <label>Level
      <select name="level">
        {% for l in ['beginner', 'intermediate', 'advanced'] %}
          <option value="{{ l }}" {% if l == product.level %}selected{% endif %}>{{ l }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Price (USD) <input type="number" step="0.01" name="price" value="{{ '%.2f' % product.price }}"></label>
    <label>Tags (comma-separated) <input type="text" name="tags" value="{{ product.tags or '' }}"></label>
    <label>Image URL <input type="url" name="image_url" value="{{ product.image_url or '' }}"
                            id="image_url_input" oninput="document.getElementById('image_preview').src=this.value"></label>
    {% if product.image_url %}
      <img id="image_preview" src="{{ product.image_url }}" alt="preview" class="image-preview"
           onerror="this.style.display='none'">
    {% endif %}
    <label>Description <textarea name="description" rows="6" required>{{ product.description }}</textarea></label>
    <div class="row-between">
      <a class="button" href="/admin/products">Cancel</a>
      <button type="submit" class="primary">Save changes</button>
    </div>
  </form>
</section>
{% endblock %}
