<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Trove{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body
  data-user-id="{% if user %}{{ user.id }}{% endif %}"
  data-user-role="{% if user %}{{ user.role }}{% endif %}"
>
  <div id="agentLiveBar" class="agent-live-bar">
    <div class="agent-live-content">
      <span class="live-pulse-dot"></span>
      <span class="agent-live-badge">AGENT LIVE</span>
      <span class="agent-live-title">Reading your signal —</span>
      <span id="agentLiveStatusText" class="agent-live-status">Observing catalog exploration & intent...</span>
    </div>
  </div>

  <nav class="topbar">
    <a class="brand" href="/">Trove</a>
    <div class="nav-links">
      <a href="/catalog">Catalog</a>
      {% if user %}
        <a href="/recommendations">For you</a>
        {% if user.is_admin %}
          <a href="/admin/products">Admin</a>
          <a href="/admin/digests">Digests</a>
        {% endif %}

        <form method="post" action="/logout" class="inline-form">
          <span class="user-email">{{ user.email }}</span>
          <button type="submit" class="link-button">Log out</button>
        </form>
      {% else %}
        <a href="/login">Log in</a>
        <a href="/register" class="cta">Sign up</a>
      {% endif %}
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/tracker.js" defer></script>
</body>
</html>
