{% extends "base.html" %}
{% block title %}Sign up · Trove{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create your account</h1>
  <p class="muted">Personalized course recommendations, tailored to how you learn.</p>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" action="/register" class="stack">
    <label>Email
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="new-password" minlength="6">
    </label>
    <label>Confirm password
      <input type="password" name="password_confirm" required autocomplete="new-password" minlength="6">
    </label>
    <button type="submit" class="primary">Create account</button>
  </form>
  <p class="muted small">Already have an account? <a href="/login">Log in</a></p>
</div>
{% endblock %}
